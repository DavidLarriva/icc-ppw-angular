<section class="students-page">
  <h1 class="students-page_title">Estudiantes</h1>
  <p class="students-page_subtitle">Selecciona un estudiante para ver su detalle.</p>
  
  <ul class="students-list">
    @for (student of students(); track student.id) {
      <li class="students-list_item">
        <a [routerLink]="['/students', student.id]">
          {{ student.name }}
        </a>
      </li>
    } @empty {
      <li class="students-empty">No hay estudiantes disponibles.</li>
    }
  </ul>
</section>
