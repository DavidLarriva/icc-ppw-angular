<section class="rounded-3xl p-6 shadow-xl bg-gradient-to-r from-sky-600 to-indigo-600">
  <p class="text-xs font-bold uppercase tracking-[0.3em] text-white/80">{{ eyebrow() }}</p>
  <h3 class="mt-2 text-2xl font-black tracking-tight text-white">{{ title() }}</h3>
  <p class="mt-2 max-w-xl text-sm text-white/90">{{ description() }}</p>
  <button class="btn btn-sm mt-4 border-none bg-white text-slate-900 hover:bg-slate-100 cursor-pointer">
    {{ actionLabel() }}
  </button>
</section>
